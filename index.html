html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:#000;overflow:hidden;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;height:100%}
.bar{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:min(1.6vh,10px);padding:6px;width:64px;flex:none;background:#000}
#left{padding-left:calc(6px + env(safe-area-inset-left,0px))}
#right{padding-right:calc(6px + env(safe-area-inset-right,0px))}
#main{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden;background:#fff}
#box{position:relative;background:#fff}
#box canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#line{pointer-events:none}
#paint{touch-action:none}
button{border:3px solid #ddd;background:#fff;border-radius:50%;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px}
.c{width:min(10vh,54px);height:min(10vh,54px)}
.c.on,.s.on,.tool.on{border-color:#000;box-shadow:0 0 0 3px #fff}
.s{width:48px;height:48px}
.s i{background:#333;border-radius:50%;display:block}
.tool{width:48px;height:48px}
#pick{position:fixed;inset:0;background:#fffe;display:none;align-items:center;justify-content:center;z-index:9}
#pick.show{display:flex}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:64px 12px 16px;max-height:100%;box-sizing:border-box;overflow:auto}
#grid button{border-radius:16px;border:4px solid #ddd;padding:4px}
#grid canvas{width:min(24vw,130px);height:min(24vw,130px)}
#x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:14px;width:48px;height:48px;z-index:10}
</style>

  b.appendChild(c);b.setAttribute('aria-label',p.n);b.onclick=()=>{pick.classList.remove('show');load(i)};grid.appendChild(b)});
document.getElementById('pages').onclick=()=>pick.classList.add('show');
document.getElementById('x').onclick=()=>pick.classList.remove('show');
// App hardening: no long-press menus, no pinch or double-tap zoom, no navigation.
['contextmenu','gesturestart','gesturechange','dragstart','selectstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
// Offline support, so it keeps working with no connection.
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline setup failed:',err)));
}
let rz;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  const m=document.getElementById('main'),dpr=Math.min(window.devicePixelRatio||1,1.5);
  if(Math.round(m.clientWidth*dpr)===W&&Math.round(m.clientHeight*dpr)===H)return;
  last=null;layout(cur,false)},150)});
load(0);
</script>
</body>
</html>
